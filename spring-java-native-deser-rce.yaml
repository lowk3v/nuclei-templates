id: spring-java-native-deserialization-rce

info:
  name: Spring BeanFactory - Java Native Deserialization (Non-Transient beanFactory)
  author: Rin Le from Secuwall (trinhtu.kma@gmail.com)
  severity: high
  description: |
    Detects HTTP endpoints vulnerable to RCE via Java native
    deserialization of Spring BeanFactory gadget classes (Chain 2).

    AbstractBeanFactoryBasedTargetSource implements Serializable but
    its beanFactory field is NOT transient. ObjectInputStream restores
    an attacker-controlled BeanFactory from the byte stream. When
    application code calls getTarget(), getBean() executes → RCE.

    Detection strategy (status-code differential, no response body dependency):
      Phase 1 — Send valid serialized String → expect 200 (deser endpoint)
      Phase 2 — Send serialized SimpleBeanTargetSource → expect 200 (gadget accepted)
      Phase 3 — Send serialized LazyInitTargetSource → expect 200 (gadget accepted)

    If Phase 1 returns 200 (deser endpoint confirmed) AND Phase 2/3
    returns 200, the gadget was deserialized with beanFactory=null.
    An attacker replaces null with a malicious BeanFactory in the stream.

    If Phase 2/3 returns error while Phase 1 succeeds, an
    ObjectInputFilter is blocking Spring classes (mitigated).

    Note: Only AbstractBeanFactoryBasedTargetSource subclasses work
    here (SimpleBeanTargetSource, LazyInitTargetSource, etc.).
    SimpleBeanFactoryAwareAspectInstanceFactory does NOT implement
    Serializable and is not viable for this chain.

    Java serialization format is version-independent — the ACED stream
    includes class metadata (serialVersionUID). One payload works
    across all JDK versions.

    Preconditions:
      - Endpoint deserializes untrusted Java serialized data
      - No ObjectInputFilter blocking Spring AOP classes
      - spring-aop on classpath (default in Spring Boot)
  impact: |
    Remote Code Execution. The non-transient beanFactory field is
    restored from the serialized stream with the attacker's malicious
    BeanFactory. When application code calls getTarget(), the injected
    BeanFactory executes arbitrary commands via getBean().
  classification:
    cwe-id: CWE-502
    cvss-score: 8.1
    cvss-metrics: CVSS:3.1/AV:N/AC:H/PR:N/UI:N/S:U/C:H/I:H/A:H
  tags: spring,deserialization,rce,java,gadget
  metadata:
    max-request: 6

# ┌──────────────────────────────────────────────────────────────┐
# │ Payload hex reference (Java serialization — ACED stream)     │
# │                                                              │
# │ String("java-deser-probe") — 23 bytes:                      │
# │   aced00057400106a6176612d64657365722d70726f6265             │
# │                                                              │
# │ SimpleBeanTargetSource(targetBeanName=...) — 319 bytes       │
# │ LazyInitTargetSource(targetBeanName=...) — 348 bytes         │
# │                                                              │
# │ All payloads have beanFactory=null (safe probe).             │
# │ Java serialization is JDK-version-independent.               │
# └──────────────────────────────────────────────────────────────┘

http:
  # ══════════════════════════════════════════════════════════════
  # Phase 1: Confirm Java deserialization endpoint
  #
  # Send a valid serialized String — universally accepted by any
  # ObjectInputStream. If the endpoint processes Java serialized
  # data, it returns 200.
  # ══════════════════════════════════════════════════════════════

  # 1A — application/x-java-serialized-object (HttpInvoker, Spring Remoting)
  - raw:
      - |
        POST {{BaseURL}} HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-java-serialized-object
        Accept: */*

        {{hex_decode('aced00057400106a6176612d64657365722d70726f6265')}}

    matchers:
      - type: status
        status:
          - 200

  # 1B — text/plain with base64 (custom endpoints)
  - raw:
      - |
        POST {{BaseURL}} HTTP/1.1
        Host: {{Hostname}}
        Content-Type: text/plain
        Accept: */*

        rO0ABXQAEGphdmEtZGVzZXItcHJvYmU=

    matchers:
      - type: status
        status:
          - 200

  # ══════════════════════════════════════════════════════════════
  # Phase 2: Gadget A — SimpleBeanTargetSource
  #
  # Serialized with targetBeanName="java-deser-gadget-test",
  # beanFactory=null, targetClass=null.
  #
  # If accepted (200), ObjectInputStream restored the gadget
  # INCLUDING the beanFactory field (because it's not transient).
  # An attacker replaces null with a malicious BeanFactory.
  #
  # If rejected while Phase 1 succeeded → ObjectInputFilter active.
  # ══════════════════════════════════════════════════════════════

  # 2A — Raw binary
  - raw:
      - |
        POST {{BaseURL}} HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-java-serialized-object
        Accept: */*

        {{hex_decode('')}}

    matchers:
      - type: status
        status:
          - 200

  # 2B — Base64
  - raw:
      - |
        POST {{BaseURL}} HTTP/1.1
        Host: {{Hostname}}
        Content-Type: text/plain
        Accept: */*

        

    matchers:
      - type: status
        status:
          - 200

  # ══════════════════════════════════════════════════════════════
  # Phase 3: Gadget B — LazyInitTargetSource
  #
  # Same hierarchy (extends AbstractBeanFactoryBasedTargetSource).
  # Trigger: getTarget() → getBeanFactory().getBean()
  # ══════════════════════════════════════════════════════════════

  # 3A — Raw binary
  - raw:
      - |
        POST {{BaseURL}} HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/x-java-serialized-object
        Accept: */*

        {{hex_decode('')}}

    matchers:
      - type: status
        status:
          - 200

  # 3B — Base64
  - raw:
      - |
        POST {{BaseURL}} HTTP/1.1
        Host: {{Hostname}}
        Content-Type: text/plain
        Accept: */*

        

    matchers:
      - type: status
        status:
          - 200

